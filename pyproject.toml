[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yaotubng"
version = "0.1.0"
description = "A local Windows audio downloader powered by yt-dlp"
requires-python = ">=3.11"
dependencies = ["yt-dlp[default]>=2026.3.17", "PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
yaotubng = "yaotubng.app:main"
yaotubng-cli = "yaotubng.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
